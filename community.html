<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — FeedAnAnimalMap</title>
<meta name="description" content="Talk with other volunteers: ask questions, share sightings, coordinate feeding runs.">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23a03b0e'/%3E%3Ctext y='72' x='50' text-anchor='middle' font-size='58'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="tailwind-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff8f6;color:#1e1b1a}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 110px}
  /* clear the shared fixed navbar */
  body.has-site-header{padding-top:68px}

/* ------------------------------- forum -------------------------------- */
.f-sort{display:flex;gap:8px;margin:12px 2px 0}
.f-sort button{padding:7px 14px;border-radius:9999px;font-size:12px;font-weight:700;
  background:#f5ecea;border:1px solid transparent;cursor:pointer;font-family:inherit;color:#57423b}
.f-sort button.on{background:#a03b0e;color:#fff}
.f-composer{margin-top:12px;border:1px solid #efe6e4;border-radius:20px;background:#fff;
  padding:14px}
.f-composer input,.f-composer textarea{width:100%;border:1px solid #dec0b6;border-radius:12px;
  padding:10px 12px;font-size:14px;font-family:inherit;background:#fffdfc;color:#1e1b1a;
  box-sizing:border-box}
.f-composer input:focus,.f-composer textarea:focus{outline:none;border-color:#a03b0e;
  box-shadow:0 0 0 3px rgba(160,59,14,.12)}
.f-composer textarea{min-height:84px;resize:vertical;margin-top:8px}
.f-post{margin-top:10px;width:100%;height:44px;border:none;border-radius:9999px;
  background:#a03b0e;color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px}
.f-post:disabled{opacity:.6;cursor:wait}
.f-post:not(:disabled):hover{background:#c15326}
.f-hint{font-size:12px;color:#ba1a1a;margin-top:8px}
.f-topic{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #efe6e4;
  border-radius:18px;background:#fff;margin-top:10px}
.f-topic:hover{box-shadow:0 6px 18px rgba(30,27,26,.06)}
.f-open{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;background:none;
  border:none;padding:0;cursor:pointer;font-family:inherit;text-align:left;color:inherit}
.f-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.f-title{font-weight:800;font-size:15px;color:#1e1b1a}
.f-meta{font-size:11px;color:#8b7269}
.f-preview{font-size:13px;color:#57423b;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.f-avatar{border-radius:14px;overflow:hidden;flex-shrink:0;position:relative;
  display:inline-flex;align-items:center;justify-content:center}
.f-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.f-initials{font-size:14px;font-weight:800;color:#fff;z-index:1}
.f-like{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#8b7269;
  cursor:pointer;user-select:none;padding:8px 10px;border-radius:9999px;flex-shrink:0}
.f-like .material-symbols-outlined{font-size:18px}
.f-like.on{color:#a03b0e;background:#ffdbcf}
.f-none{text-align:center;font-size:13px;color:#57423b;margin-top:26px}
.f-none a{color:#a03b0e;font-weight:700}
.f-thread{margin-top:14px;border:1px solid #efe6e4;border-radius:20px;background:#fff;
  padding:16px}
.f-thread h2{font-size:17px;font-weight:800;margin:0}
.f-thread .f-meta{margin-top:2px}
.f-thread .f-body{font-size:14px;line-height:1.65;color:#3b3330;margin:10px 0 4px;
  white-space:pre-wrap}
.f-reply{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.f-bubble{flex:1;min-width:0;background:#fbf2f0;border:1px solid #efe6e4;border-radius:4px 16px 16px 16px;
  padding:10px 12px}
.f-bubble p{font-size:13.5px;line-height:1.6;margin:4px 0 0;white-space:pre-wrap;color:#1e1b1a}
.f-replyrow{display:flex;gap:8px;margin-top:12px}
.f-replyrow input{flex:1;min-width:0;height:44px;border:1px solid #dec0b6;border-radius:9999px;
  padding:0 16px;font-size:14px;font-family:inherit;background:#fffdfc}
.f-replyrow input:focus{outline:none;border-color:#a03b0e;box-shadow:0 0 0 3px rgba(160,59,14,.12)}
.f-send{height:44px;padding:0 20px;border:none;border-radius:9999px;background:#a03b0e;
  color:#fff;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0}
.f-send:disabled{opacity:.6;cursor:wait}
.f-back{background:none;border:none;color:#a03b0e;font-weight:800;font-size:12px;cursor:pointer;
  font-family:inherit;padding:0;margin-bottom:8px}
.f-modeline{font-size:11px;color:#8b7269;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap">
  <p><a href="index.html" style="color:#a03b0e">← Back to the map</a></p>

    <div class="f-composer">
      <input id="topic-title" type="text" maxlength="140" placeholder="Start a topic — e.g. “Who feeds the market cats on Fridays?”" aria-label="Topic title">
      <textarea id="topic-body" maxlength="4000" placeholder="Say more… sightings, questions, feeding runs, lost &amp; found." aria-label="Topic details"></textarea>
      <button type="button" class="f-post" id="topic-post">
        <span class="material-symbols-outlined" style="font-size:18px">post_add</span>Post topic
      </button>
      <p class="f-hint hidden" id="composer-hint"></p>
    </div>

    <div class="f-sort" aria-label="Sort topics">
      <button type="button" class="on" data-sort="recent">Newest</button>
      <button type="button" data-sort="active">Most active</button>
      <button type="button" data-sort="top">Most liked</button>
    </div>

    <div id="topics"></div>
    <p id="topics-empty" class="f-none hidden"></p>

    <section id="thread" class="f-thread hidden" aria-live="polite">
      <button type="button" class="f-back" id="thread-close">← All topics</button>
      <div class="flex items-start gap-3">
        <span id="thread-face"></span>
        <div class="flex-1 min-w-0">
          <h2 id="thread-title"></h2>
          <p class="f-meta" id="thread-meta"></p>
        </div>
      </div>
      <p class="f-body" id="thread-body"></p>
      <div id="thread-replies"></div>
      <div class="f-replyrow">
        <input id="reply-body" type="text" maxlength="2000" placeholder="Write a reply…" aria-label="Reply">
        <button type="button" class="f-send" id="reply-send">Reply</button>
      </div>
      <p class="f-hint hidden" id="reply-hint"></p>
    </section>

    <p class="f-modeline" id="forum-mode"></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="forum.js"></script>
<script src="site-header.js"></script>
</body>
</html>
