<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register - FeedAnAnimalMap</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff8f6;color:#1e1b1a}
.fta-field{width:100%;height:44px;padding:0 14px;border-radius:.8rem;border:1px solid #dec0b6;background:#fff;font-size:14px}
.fta-field:focus{outline:none;border-color:#a03b0e;box-shadow:0 0 0 3px rgba(160,59,14,.12)}
.fta-btn{height:44px;border-radius:9999px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.fta-btn:disabled{opacity:.6;cursor:wait}
#toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:#1e1b1a;color:#fff8f6;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.toast.ok{background:#006d30}.toast.err{background:#ba1a1a}.toast.info{background:#006194}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div id="toast-wrap"></div>
<div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-[#efe6e4] p-6">
<div class="flex items-center gap-3 mb-1">
<span class="h-10 w-10 rounded-full flex items-center justify-center text-xl" style="background:#a03b0e">🐾</span>
<div><h1 class="text-xl font-bold">Welcome back</h1>
<p class="text-sm text-[#57423b]">Login unlocks chat + sync. Feeding works without login.</p></div>
</div>
<div id="auth-status" class="mt-3 text-sm hidden rounded-xl p-3"></div>
<button id="btn-google" class="fta-btn mt-4 bg-white border border-[#dec0b6]">Continue with Gmail / Google</button>

<p class="text-[11px] mt-2">Gmail needs setup: Supabase Auth Providers Google ON. Until then use email link.</p>
<div class="flex items-center gap-3 my-4"><div class="h-px bg-[#efe6e4] flex-1"></div><span class="text-xs">or email</span><div class="h-px bg-[#efe6e4] flex-1"></div></div>
<label class="text-xs font-bold" for="auth-email">Email</label>
<input id="auth-email" class="fta-field mt-1" type="email" placeholder="you@gmail.com">
<button id="btn-magic" class="fta-btn mt-3 text-white" style="background:#a03b0e">Send login link</button>
<div class="flex items-center gap-3 my-4"><div class="h-px bg-[#efe6e4] flex-1"></div><span class="text-xs">or password</span><div class="h-px bg-[#efe6e4] flex-1"></div></div>
<label class="text-xs font-bold" for="auth-name">Display name (register only)</label>
<input id="auth-name" class="fta-field mt-1" type="text" placeholder="Alex R.">
<label class="text-xs font-bold mt-3 block" for="auth-password">Password</label>
<input id="auth-password" class="fta-field mt-1" type="password" placeholder="........">
<div class="flex gap-2 mt-3">
<button id="btn-login" class="fta-btn text-white" style="background:#006d30">Login</button>
<button id="btn-register" class="fta-btn" style="background:#ffdbcf">Register</button>
</div>
<div class="flex items-center justify-between mt-4">
<a href="index.html" class="text-sm font-semibold" style="color:#a03b0e">Back to map</a>
<button id="btn-logout" class="text-sm hidden">Sign out</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
var $ = function(id){ return document.getElementById(id); };
function toast(msg, tone){
var wrap = $('toast-wrap');
var d = document.createElement('div');
d.className = 'toast ' + (tone || '');
d.textContent = msg;
wrap.appendChild(d);
setTimeout(function(){ d.remove(); }, 4200);
}
function status(msg, ok){
var el = $('auth-status'); el.classList.remove('hidden');
el.style.background = ok ? '#92f5a4' : '#ffdad6'; el.textContent = msg;
}
function setBusy(b){
['btn-google','btn-magic','btn-login','btn-register'].forEach(function(id){
var el = $(id); if (el) el.disabled = !!b;
});
var m = $('btn-magic'); if (m && b) toast('Sending...', 'info');
}
function friendlyError(e){
var msg = (e && e.message) ? e.message : String(e);
if (/429|too many|rate/i.test(msg)) return 'Too many tries — Supabase paused signups for ~1 minute (spam protection). Wait 60 seconds, then press Register ONCE.';
if (/confirm|verify|confirmation/i.test(msg)) return msg + ' — check your inbox/spam for the confirm link, click it, then press Login.';
return msg;
}
function email(){ return ($('auth-email').value || '').trim(); }
async function showUser(){
try {
var u = await window.sbAuth.currentUser();
if (u) { status('Signed in as ' + (u.email || u.id), true); $('btn-logout').classList.remove('hidden'); }
} catch(e){}
}
$('btn-google').onclick = async function(){
setBusy(true);
try { toast('Opening Google...', 'info'); await window.sbAuth.signInWithGoogle(); }
catch(e){ var m = friendlyError(e); status('Google not configured yet: ' + m, false); toast(m, 'err'); }
setBusy(false);
};
$('btn-magic').onclick = async function(){
setBusy(true);
try { await window.sbAuth.signInWithEmailLink(email()); status('Link sent! Check your email (and spam) now.', true); toast('Login link sent — check your email!', 'ok'); }
catch(e){ var m = friendlyError(e); status(m, false); toast(m, 'err'); }
setBusy(false);
};
$('btn-register').onclick = async function(){
setBusy(true);
try {
toast('Creating your account...', 'info');
await window.sbAuth.signUpWithPassword(email(), $('auth-password').value, $('auth-name').value);
status('Account created! Check your email for the confirm link, click it, then press Login.', true);
toast('Account created! Check your email, then Login.', 'ok');
showUser();
} catch(e){ var m = friendlyError(e); status(m, false); toast(m, 'err'); }
setBusy(false);
};
$('btn-login').onclick = async function(){
setBusy(true);
try {
toast('Logging you in...', 'info');
await window.sbAuth.signInWithPassword(email(), $('auth-password').value);
status('Logged in! Back to map...', true);
toast('Welcome back!', 'ok');
setTimeout(function(){ location.href = 'index.html'; }, 800);
} catch(e){ var m = friendlyError(e); status(m, false); toast(m, 'err'); }
setBusy(false);
};
$('btn-logout').onclick = async function(){ await window.sbAuth.signOut(); location.reload(); };
showUser();
})();
</script>
</body>
</html>
